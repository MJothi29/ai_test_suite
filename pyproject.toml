[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_test_suite"
version = "0.0.1"
description = "AI Test Suite for Frappe ERPNext"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MJothi29", email = "your-email@example.com" }
]
keywords = ["frappe", "erpnext", "testing", "automation", "ai"]

dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Frappe",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MJothi29/ai_test_suite"
Repository = "https://github.com/MJothi29/ai_test_suite"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_test_suite*"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"